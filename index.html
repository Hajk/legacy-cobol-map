<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
  /* Odvození základu adresy. Stránka běží i za reverzní proxy na podcestě
     (…/Legacy COBOL system/) a tam se otevře i BEZ koncového lomítka — pak by prohlížeč
     hledal styl.css v kořeni a stránka přijde bez stylů a bez odkazů.
     Base se proto počítá z vlastní adresy: končí-li poslední část tečkou
     v názvu, je to soubor; jinak je to složka a lomítko se doplní. */
  (function () {
    var p = location.pathname, i = p.lastIndexOf('/'), posl = p.slice(i + 1)
    var base = posl.indexOf('.') >= 0 ? p.slice(0, i + 1) : (p.endsWith('/') ? p : p + '/')
    var b = document.createElement('base'); b.href = base; document.head.appendChild(b)
  })()
</script>
<title>Code map</title><link rel="stylesheet" href="styl.css"></head>
<body>
<!-- Žádný název systému natvrdo: nadpis, podtitul i poznámka pod čarou
     se berou z data/mapa.json (blok `meta`). Tahle stránka je šablona,
     ne stránka o Kellu. -->
<!-- Ozubené kolo sedí na úrovni záložek, ne u mapy: motiv a akcentní barva
     platí pro celou stránku, takže se k nim musí dát dostat z každé záložky.
     ⚠️ Není to `button[data-tab]` — přepínání záložek si proto vybírá jen
     tlačítka s `data-tab`, jinak by kolo přepnulo na záložku „undefined". -->
<nav class="zalozky" id="zalozky">
  <button data-tab="dash" class="aktivni">Dashboard</button><button data-tab="mapa">Code map</button><button data-tab="proof">Proof</button><button data-tab="aplikace">Application</button>
  <button id="nastaveni" class="ikona" title="Appearance settings" aria-label="Appearance settings">⚙</button>
</nav>

<header>
  <div class="titulek">
    <div>
      <h1 id="nadpis"></h1>
      <p class="podtitul" id="podtitul"></p>
    </div>
  </div>
  <div class="ovladace">
    <button id="zpet">← back</button>
    <button id="celek" title="Zoom the whole map back into view">Fit</button>
    <span id="stav"></span>
  </div>
  <div class="filtry" id="filtry">
    <span class="skupina">Links</span>
    <label><input type="checkbox" id="f-call" checked>
      <i class="vzorek call"></i> calls <b id="n-call">0</b></label>
    <label><input type="checkbox" id="f-data">
      <i class="vzorek data"></i> shared data <b id="n-data">0</b></label>
    <label class="prah" title="Hides weak links: a line is drawn only when there are at least this many calls between the two. The strongest dependencies stay.">hide links under
      <select id="f-prah">
        <option value="1">1 call</option>
        <option value="2">2 calls</option>
        <option value="5">5 calls</option>
        <option value="10">10 calls</option>
      </select>
    </label>
    <label id="l-osirele"><input type="checkbox" id="f-osirele">
      hide programs nobody calls</label>
    <span class="skupina odsazeno" id="l-karta">Card</span>
    <!-- Legenda se mění s úrovní: na přehledu podsystémů nese karta budík
         náročnosti, uvnitř podsystému proužek vazby na Dialog System. Jedna
         společná legenda by tvrdila, že karta ukazuje obojí. -->
    <span class="legenda-gui" id="l-narocnost">
      <svg class="vzorek-budik" viewBox="0 0 22 13" aria-hidden="true"><path d="M2 11.5 A9 9 0 0 1 20 11.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".3"/><path d="M2 11.5 A9 9 0 0 1 8.2 2.9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="11" y1="11.5" x2="6.5" y2="4.7" stroke="currentColor" stroke-width="1.3"/></svg>
      rewrite effort
      <em>indicator — 2 × unique lines + 1 × screens, each against the largest subsystem</em></span>
    <span class="legenda-gui" id="l-gui" hidden title="A program that calls DSRUN, the Dialog System runtime, has its business logic and its screen handling in the same code. It cannot be ported on its own — the screen has to be rebuilt with it.">
      <i class="vzorek gui"></i> tied to the Dialog System GUI</span>
  </div>
</header>

<section class="dlazdice" id="dlazdice"></section>

<main>
  <svg id="platno"></svg>
  <aside id="panel"></aside>
</main>

<section id="dash" class="dash" hidden></section>
<!-- Záložka Proof: výsledek měřidla. Vykresluje se z data/meridlo.json, který
     vyrábí nastroje/meridlo-export.py ze skutečných běhů sondy — žádné číslo
     na téhle stránce není napsané rukou. -->
<section id="proof" class="dash" hidden></section>
<!-- Záložka Application: modernizovaná aplikace. Je to samostatný build
     (React + Rust→WASM) vložený rámem — vlastní repozitář, vlastní build,
     nulové sdílení skriptů se stránkou okolo. Rám je tu schválně: běží to
     celé v prohlížeči, takže žádný server, žádné API, nic k rozbití. -->
<section id="aplikace" class="dash celostrana" hidden>
  <iframe id="ram-aplikace" title="Modernised application" loading="lazy"></iframe>
</section>

<!-- Panel je rozdělený na dvě skupiny a obě jsou vidět vždycky. Druhá možnost
     byla mapové volby mimo záložku mapy schovat — zavrženo: panel by měnil tvar
     podle toho, kde zrovna jsem, a volba, kterou uživatel jednou viděl, by
     jinde beze stopy zmizela. Popisek to vysvětlí jednou a natrvalo. -->
<div id="panel-nastaveni" class="nastaveni" hidden>
  <h3>Appearance</h3>
  <p class="skupina">Applies to the whole page</p>
  <label>Theme
    <span class="prepinac-rezim">
      <button data-rezim="light">light</button><button data-rezim="dark">dark</button>
    </span>
  </label>
  <label>Accent colour
    <span class="vzorky" id="n-barvy"></span>
  </label>
  <p class="skupina">Code map only</p>
  <label>Link strength
    <input type="range" id="n-hrany" min="10" max="90" step="5"></label>
  <label>Card size
    <input type="range" id="n-karty" min="70" max="160" step="5"></label>
  <label><input type="checkbox" id="n-prstence"> Ring guides</label>
  <label><input type="checkbox" id="n-popisky"> Always show numbers</label>
  <p class="pozn">Saved in this browser. <button id="n-reset" class="maly">Reset</button></p>
</div>

<footer class="patka"><p id="patka-text"></p></footer>
<div id="bublina" class="bublina" hidden></div>
<script src="mapa.js"></script>
</body></html>
